[project]
name = "estimo-pipeline"
version = "0.2.0"
description = "Estimo pipeline: parse -> decompose -> ambiguity gate -> questions (LangGraph)"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "estimo-core",
    "estimo-parse",
    "estimo-gateway",
    "langgraph>=1.2,<2",
    "pydantic>=2.13.4,<3",
]

[project.scripts]
estimo-pipeline = "estimo_pipeline.cli:main"
estimo-eval = "estimo_pipeline.evals:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
