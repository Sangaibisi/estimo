[project]
name = "estimo-gateway"
version = "0.1.0"
description = "The ONLY Estimo module that talks to the LLM endpoint (OpenAI-compatible, LiteLLM at deployments)"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "estimo-core",
    "openai>=2.52,<3",
    "httpx>=0.28,<0.29",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
