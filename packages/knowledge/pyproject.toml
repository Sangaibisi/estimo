[project]
name = "estimo-knowledge"
version = "0.2.0"
description = "Estimo knowledge layer: estimate ledger, hybrid Turkish retrieval, analogy cards"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "estimo-core",
    "estimo-gateway",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "asyncpg>=0.31,<0.32",
    "pgvector>=0.5,<0.6",
    "openpyxl>=3.1,<4",
    "pydantic>=2.13.4,<3",
]

[project.scripts]
estimo-ledger-import = "estimo_knowledge.cli:main"
estimo-embed = "estimo_knowledge.embed_cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
