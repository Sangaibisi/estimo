[project]
name = "estimo-connectors"
version = "0.2.0"
description = "Estimo live-knowledge connectors: Confluence, Bitbucket-first git hosting, Jira"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "estimo-core",
    "estimo-gateway",
    "estimo-knowledge",
    "httpx>=0.28,<1",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "pydantic>=2.13.4,<3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
