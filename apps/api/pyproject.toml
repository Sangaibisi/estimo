[project]
name = "estimo-api"
version = "0.1.0"
description = "Estimo API service: pipeline orchestration entrypoints, run records, health"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "estimo-core",
    "estimo-gateway",
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.52,<0.53",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.18.5,<2",
    "pgvector>=0.5,<0.6",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
