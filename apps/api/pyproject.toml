[project]
name = "estimo-api"
version = "0.2.0"
description = "Estimo API service: pipeline orchestration entrypoints, run records, health"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "estimo-core",
    "estimo-gateway",
    "estimo-knowledge",
    "estimo-parse",
    "estimo-pipeline",
    "estimo-estimate",
    "estimo-code",
    "estimo-connectors",
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.52,<0.53",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.18.5,<2",
    "pgvector>=0.5,<0.6",
    "python-multipart>=0.0.18,<0.1",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    # Observability client (S8-4, MIT): a complete no-op unless LANGFUSE_* env is set.
    "langfuse>=4,<5",
    # OIDC bearer-token validation (S10-1). PyJWT is FastAPI's recommended JWT lib and
    # ships PyJWKClient (JWKS fetch/cache/rotation). python-jose is banned (abandoned).
    "pyjwt[crypto]>=2.13,<3",
    # MCP server (S10-5), mounted into the FastAPI app over streamable HTTP.
    "fastmcp>=3.4,<4",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
