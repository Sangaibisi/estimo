<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Estimo mark: three range bars (optimistic / likely / pessimistic) on the brand
       gradient (violet brand pair = --grad-brand) — the product's signature RangeBar, readable at 16px. Keep in sync
       with LogoMark in components/icons.tsx. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a06ee8"/>
      <stop offset="1" stop-color="#5b2ea6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <rect x="8" y="8.6" width="10" height="3.4" rx="1.7" fill="#fff" opacity="0.75"/>
  <rect x="8" y="14.3" width="16" height="3.4" rx="1.7" fill="#fff"/>
  <rect x="8" y="20" width="13" height="3.4" rx="1.7" fill="#fff" opacity="0.75"/>
</svg>
