name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # With a dedicated token (fine-grained PAT / GitHub App secret named
          # RELEASE_PLEASE_TOKEN) the release PR triggers normal CI; with the default
          # token it does not, and CI runs on the push to main after merge instead.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # The version bumps rewrite every pyproject version, which uv.lock pins —
      # without this refresh the release PR is deterministically stale and
      # `uv lock --check` / `uv sync --locked` fail everywhere after merge.
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release-please--branches--main
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.x"
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        name: Refresh uv.lock on the release branch
        run: |
          uv lock
          if ! git diff --quiet uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: refresh uv.lock for release versions"
            git push origin HEAD:release-please--branches--main
          fi
