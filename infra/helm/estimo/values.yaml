# Estimo Helm values. BYOC: set postgres.bundled=false and point database.url at your
# managed instance; set auth.* to your OIDC IdP; gateway.* to your LiteLLM endpoint.

image:
  registry: ghcr.io/sangaibisi
  apiRepository: estimo-api
  webRepository: estimo-web
  # `main` is built and pushed on every merge and is what exists in GHCR today. Pin a
  # released semver (e.g. "0.2.0") once one is tagged — CI publishes {{version}} and
  # {{major}}.{{minor}} on every v* tag — and drop pullPolicy back to IfNotPresent.
  tag: "main"
  pullPolicy: Always

api:
  # One replica by default: the git working tree below is a single ReadWriteOnce
  # claim. Scaling out requires a ReadWriteMany class (see reposStorage.accessMode);
  # the chart fails the install rather than leaving a pod Pending forever.
  replicas: 1
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }
  # Working-tree storage for the S9 git connectors.
  reposStorage:
    size: 5Gi
    storageClassName: ""
    accessMode: ReadWriteOnce   # ReadWriteMany to run api.replicas > 1

web:
  replicas: 2
  # Browser-visible API origin — injected at runtime, never baked (see apps/web).
  apiUrl: "https://estimo.example.com/api"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

# Database. Multi-tenant deployments MUST set url to the NOSUPERUSER estimo_app role
# (a superuser bypasses RLS — ADR-0007) and migrationUrl to the owner role.
database:
  # API runtime URL. Empty => built from the bundled Postgres (owner; single-tenant).
  url: ""
  # Owner URL migrations run with (CREATE ROLE / bypass RLS). Empty => same as url
  # (bundled owner). In multi-tenant BYO, set this to the owner while url = estimo_app.
  migrationUrl: ""
  # Owner URL for cross-tenant SYSTEM paths (startup janitor, webhook lookup). Optional.
  ownerUrl: ""
  # Password the migration assigns to the estimo_app role (multi-tenant). Prefer
  # appRoleExistingSecret — a value here is readable via `helm get values`.
  appRolePassword: ""
  appRoleExistingSecret: ""   # secret with key ESTIMO_APP_ROLE_PASSWORD (preferred)
  # Secret with key ESTIMO_DATABASE_URL. When set it wins over database.url, and the
  # chart stops projecting a URL into the pod env so the secret is the only source.
  existingSecret: ""

postgres:
  bundled: true               # false => BYO managed Postgres via database.url
  image: pgvector/pgvector:0.8.6-pg18-trixie
  storage:
    size: 20Gi
    storageClassName: ""
  auth:
    database: estimo
    username: estimo
    # For production, prefer an existing secret over a value here.
    existingSecret: ""

# OIDC (S10-1). Empty issuer => single-tenant open mode.
auth:
  issuer: ""
  audience: "estimo-api"
  roleClaim: "realm_access.roles"
  tenantClaim: "tenant"
  # Claim carrying the caller's source-system audiences, matched against the
  # acl_keys your connectors write. Empty => ACL-filtered surfaces serve public
  # content only; it never falls back to serving everything.
  aclClaim: ""

# LiteLLM gateway (ADR-0001). Required for real LLM calls.
gateway:
  baseUrl: ""                 # e.g. https://litellm.internal/v1
  existingSecret: ""          # secret with key ESTIMO_GATEWAY__API_KEY
  profiles: '{"default": "gpt-4o-mini"}'

# One host fronts both apps: /api → API, / → web. Set web.apiUrl to https://<host>/api.
ingress:
  enabled: false
  className: ""
  host: estimo.example.com
  tls: true
  tlsSecretName: ""           # defaults to <release>-tls
  annotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}             # e.g. IRSA / Workload Identity binding
