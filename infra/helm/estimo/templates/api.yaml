apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "estimo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: estimo
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: estimo
        app.kubernetes.io/component: api
    spec:
      # migrate → api ordering: the migration Job runs alembic to head first.
      initContainers:
        - name: wait-migrate
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z {{ .Release.Name }}-postgres 5432; do sleep 2; done"]
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/{{ .Values.image.apiRepository }}:{{ include "estimo.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-env
          env:
            {{- if .Values.postgres.bundled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecret | default (printf "%s-postgres" .Release.Name) }}
                  key: POSTGRES_PASSWORD
            {{- end }}
            - name: ESTIMO_DATABASE_URL
              value: {{ include "estimo.databaseUrl" . | quote }}
            - name: ESTIMO_REPOS_DIR
              value: /data/repos
          volumeMounts:
            - name: repos
              mountPath: /data/repos
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: repos
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-repos
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "estimo.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: estimo
    app.kubernetes.io/component: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-repos
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.api.reposStorage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.reposStorage.size }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels: {{- include "estimo.labels" . | nindent 4 }}
  annotations:
    # Run migrations before the app rolls out. Migrations use the OWNER role (bypass
    # RLS by design); the API connects as estimo_app in multi-tenant mode (ADR-0007).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/{{ .Values.image.apiRepository }}:{{ include "estimo.imageTag" . }}"
          command: ["alembic", "-c", "/app/apps/api/alembic.ini", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-env
