{{- include "estimo.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "estimo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: estimo
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: estimo
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "estimo.serviceAccountName" . }}
      initContainers:
        {{- if .Values.postgres.bundled }}
        - name: wait-postgres
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z {{ .Release.Name }}-postgres 5432; do sleep 2; done"]
        {{- end }}
        # Migrations run here (not a pre-install hook) so they work with the bundled
        # StatefulSet, which does not exist yet when hooks fire. Owner role (CREATE
        # ROLE / bypass RLS); the API itself connects as estimo_app in multi-tenant.
        - name: migrate
          image: "{{ .Values.image.registry }}/{{ .Values.image.apiRepository }}:{{ include "estimo.imageTag" . }}"
          command: ["alembic", "-c", "/app/apps/api/alembic.ini", "upgrade", "head"]
          envFrom: {{- include "estimo.envFrom" . | nindent 12 }}
          env:
            {{- if .Values.postgres.bundled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecret | default (printf "%s-postgres" .Release.Name) }}
                  key: POSTGRES_PASSWORD
            {{- end }}
            {{- if not .Values.database.existingSecret }}
            - name: ESTIMO_DATABASE_URL
              value: {{ include "estimo.migrationDatabaseUrl" . | quote }}
            {{- end }}
            {{- if .Values.database.appRoleExistingSecret }}
            - name: ESTIMO_APP_ROLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.appRoleExistingSecret }}
                  key: ESTIMO_APP_ROLE_PASSWORD
            {{- else if .Values.database.appRolePassword }}
            - name: ESTIMO_APP_ROLE_PASSWORD
              value: {{ .Values.database.appRolePassword | quote }}
            {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/{{ .Values.image.apiRepository }}:{{ include "estimo.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom: {{- include "estimo.envFrom" . | nindent 12 }}
          env:
            {{- if .Values.postgres.bundled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecret | default (printf "%s-postgres" .Release.Name) }}
                  key: POSTGRES_PASSWORD
            {{- end }}
            {{- if not .Values.database.existingSecret }}
            - name: ESTIMO_DATABASE_URL
              value: {{ include "estimo.apiDatabaseUrl" . | quote }}
            {{- end }}
            {{- if .Values.database.ownerUrl }}
            - name: ESTIMO_OWNER_DATABASE_URL
              value: {{ .Values.database.ownerUrl | quote }}
            {{- end }}
            - name: ESTIMO_REPOS_DIR
              value: /data/repos
          volumeMounts:
            - name: repos
              mountPath: /data/repos
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: repos
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-repos
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "estimo.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: estimo
    app.kubernetes.io/component: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-repos
spec:
  accessModes: [{{ .Values.api.reposStorage.accessMode | quote }}]
  {{- with .Values.api.reposStorage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.reposStorage.size }}
