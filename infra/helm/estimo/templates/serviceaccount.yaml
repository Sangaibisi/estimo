{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "estimo.serviceAccountName" . }}
  labels: {{- include "estimo.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# Estimo calls no Kubernetes API; the token exists only so cloud IAM can be bound to
# the workload (IRSA / Workload Identity) for a managed database or secret store.
automountServiceAccountToken: false
{{- end }}
