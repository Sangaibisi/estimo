apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env
  labels: {{- include "estimo.labels" . | nindent 4 }}
type: Opaque
stringData:
  ESTIMO_LOG_LEVEL: "INFO"
  {{- with .Values.gateway.baseUrl }}
  ESTIMO_GATEWAY__BASE_URL: {{ . | quote }}
  {{- end }}
  ESTIMO_GATEWAY__PROFILES: {{ .Values.gateway.profiles | quote }}
  {{- with .Values.auth.issuer }}
  ESTIMO_AUTH__ISSUER: {{ . | quote }}
  ESTIMO_AUTH__AUDIENCE: {{ $.Values.auth.audience | quote }}
  ESTIMO_AUTH__ROLE_CLAIM: {{ $.Values.auth.roleClaim | quote }}
  ESTIMO_AUTH__TENANT_CLAIM: {{ $.Values.auth.tenantClaim | quote }}
  {{- end }}
  {{- if .Values.database.url }}
  ESTIMO_DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
# NOTE: secret material (gateway API key, DB password, app-role password) belongs in
# an existingSecret referenced by gateway.existingSecret / database.existingSecret /
# postgres.auth.existingSecret — do NOT put live credentials in values.yaml.
